<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PPPLAB Photo Booth</title>
  
  <!-- OG 태그: 카카오/인스타 미리보기용 -->
  <meta property="og:title" content="PPPLAB 월드컵XR Photo Booth">
  <meta property="og:description" content="나만의 XR 포토부스 사진을 확인하세요!">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ppplab-official.github.io/exhibition/logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- 카카오 SDK: 반드시 head에서 먼저 로드 -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.6.0/kakao.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
      animation: fadeDown 0.6s ease-out;
    }

    .photo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #111;
      margin-bottom: 24px;
      animation: fadeUp 0.7s ease-out 0.15s both;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-frame .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
    }

    .hint {
      font-size: 14px;
      color: #9a9a9a;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.4;
      animation: fadeUp 0.7s ease-out 0.25s both;
    }

    .hashtags {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: #E84A2E;
      text-align: center;
      margin-bottom: 32px;
      animation: fadeUp 0.7s ease-out 0.3s both;
    }

    .share-section {
      width: 100%;
      animation: fadeUp 0.7s ease-out 0.45s both;
    }

    .share-label {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .share-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .share-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
      border: none;
      border-radius: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      text-decoration: none;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    .share-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .share-btn.instagram {
      background: linear-gradient(135deg, #833AB4, #E1306C, #F77737);
    }

    .share-btn.kakao {
      background: #FEE500;
      color: #191919;
    }

    .share-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .credit {
      margin-top: 40px;
      font-size: 11px;
      color: #333;
      letter-spacing: 1px;
      animation: fadeUp 0.7s ease-out 0.6s both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <img src="logo.png" alt="PPPLAB" class="logo">

  <div class="photo-frame">
    <div class="loading" id="loading">사진 불러오는 중...</div>
    <img id="photo" alt="Photo Booth" style="display:none;" 
         onload="this.style.display='block'; document.getElementById('loading').style.display='none';">
  </div>

  <div class="hint">사진을 길게 눌러 저장해주세요.</div>
  <div class="hashtags">#월드컵XR  #OOO브랜드</div>

  <div class="share-section">
    <div class="share-label">Share</div>
    <div class="share-buttons">
      <button class="share-btn instagram" onclick="shareInstagram()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        스토리
      </button>

      <button class="share-btn kakao" onclick="shareKakao()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.463 2 10.691c0 2.72 1.8 5.108 4.516 6.467-.178.636-.645 2.307-.739 2.666-.116.445.163.439.343.32.14-.094 2.239-1.52 3.153-2.14.879.13 1.786.197 2.727.197 5.523 0 10-3.463 10-7.691S17.523 3 12 3z"/></svg>
        카카오톡
      </button>
    </div>
  </div>

  <div class="credit">© PPPLAB</div>
</div>

<script>
  // 카카오 SDK 초기화 (감독님 JavaScript 키)
  Kakao.init('cbd8d81bfc34db8fccdb817f9d2e924c');

  // R2 공개 URL
  const R2_BASE = "https://pub-e0640be38e8e437ab229928889d7eaff.r2.dev";

  // URL 파라미터에서 파일명 가져오기
  const params = new URLSearchParams(window.location.search);
  const photoFile = params.get('p') || 'test.gif';
  const photoURL = R2_BASE + '/' + photoFile;

  // 사진 로드
  document.getElementById('photo').src = photoURL;

  // 인스타그램 스토리 열기
  function shareInstagram() {
    window.location.href = 'instagram://story-camera';
    setTimeout(function() {
      window.location.href = 'https://www.instagram.com/';
    }, 800);
  }

// 카카오톡 공유
  function shareKakao() {
    var url = window.location.href;
    
    if (navigator.share) {
      navigator.share({
        title: 'PPPLAB 월드컵XR Photo Booth',
        text: '#월드컵XR #OOO브랜드',
        url: url
      });
    } else {
      navigator.clipboard.writeText(url).then(function() {
        alert('링크가 복사되었습니다!\n카카오톡에 붙여넣기 해주세요.');
      });
    }
  }
  
</script>

</body>
</html>
